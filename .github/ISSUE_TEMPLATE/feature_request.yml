name: Feature request
description: Suggest an improvement or a new capability for PulseCut
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. PulseCut is local-first: core processing runs on the user's machine,
        and anything that sends data off-device should be opt-in and clearly visible in Settings.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or existing features that come close.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture (OBS / segment buffer)
        - Detection and chat analysis
        - Editing and rendering
        - Titles, captions and metadata
        - Publishing
        - Desktop app UI
        - CLI
        - Documentation
        - Other
    validations:
      required: false
  - type: checkboxes
    id: local-first
    attributes:
      label: Privacy
      options:
        - label: If this feature sends data off the user's machine, I have described it as opt-in below.
          required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mock-ups, links, or example streams or clips (remove any private content first).
    validations:
      required: false
