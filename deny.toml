# cargo-deny policy: run `cargo deny check` (also run in CI).
[graph]
all-features = false

[advisories]
# Unmaintained-crate notices are reported but only vulnerabilities fail the build.
unmaintained = "workspace"
yanked = "warn"
ignore = [
  # rsa Marvin attack: affects private-key decryption/signing timing. PulseCut only verifies
  # Kick webhook signatures with a public key. No fixed rsa 0.9 release exists.
  { id = "RUSTSEC-2023-0071", reason = "public-key signature verification only" },
  # SQLite < 3.54 with a crafted db + -wal pair; local attack on PulseCut's own data dir.
  # sqlx 0.9 pins libsqlite3-sys < 0.38. Revisit when sqlx allows the fixed version.
  { id = "RUSTSEC-2026-0459", reason = "local-only, blocked by sqlx version pin; tracked" },
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained notice, no vulnerability; migration tracked" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "CDLA-Permissive-2.0",
  "0BSD",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
