[workspace]
resolver = "3"
members = [
  "crates/pulsecut-core",
  "crates/pulsecut-detect",
  "crates/pulsecut-media",
  "crates/pulsecut-edit",
  "crates/pulsecut-meta",
  "crates/pulsecut-store",
  "crates/pulsecut-capture",
  "crates/pulsecut-chat",
  "crates/pulsecut-platform",
  "crates/pulsecut-publish",
  "crates/pulsecut-engine",
  "crates/pulsecut-cli",
  "crates/pulsecut-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SJ-Hariharan/PulseCut"
rust-version = "1.88"

[workspace.dependencies]
pulsecut-core = { path = "crates/pulsecut-core" }
pulsecut-detect = { path = "crates/pulsecut-detect" }
pulsecut-media = { path = "crates/pulsecut-media" }
pulsecut-edit = { path = "crates/pulsecut-edit" }
pulsecut-meta = { path = "crates/pulsecut-meta" }
pulsecut-store = { path = "crates/pulsecut-store" }
pulsecut-capture = { path = "crates/pulsecut-capture" }
pulsecut-chat = { path = "crates/pulsecut-chat" }
pulsecut-publish = { path = "crates/pulsecut-publish" }
pulsecut-platform = { path = "crates/pulsecut-platform" }
pulsecut-engine = { path = "crates/pulsecut-engine" }

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal", "net"] }
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rayon = "1.12"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
obws = "0.15"
cpal = "0.18"
global-hotkey = "0.10"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "clipboard"] }
egui = "0.37"
egui_extras = "0.37"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
hound = "3.5"
keyring = "4"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
sysinfo = "0.40"
futures-util = "0.3"
url = "2.5"
tempfile = "3"
toml = "1"
which = "8"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
